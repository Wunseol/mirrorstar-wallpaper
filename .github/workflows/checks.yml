name: Checks

# 可复用工作流：CI 与 Release 共用同一套检查定义，避免重复维护（B-TD-005/007-011）
# 调用方：ci.yml（push/PR 触发）、release.yml（tag 触发，build 前置门）
on:
  workflow_call:

jobs:
  rust-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Rust stable 通道：满足 MSRV 1.80（Cargo.toml rust-version），同时跟进新版编译优化与 lints
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Swatinem/rust-cache@v2 自动管理 cargo 缓存（cache-key 含 Cargo.lock / Cargo.toml / runner.os）
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 构建 wp-proc 资源：src-tauri/build.rs 经 tauri_build::try_build 编译期校验 bundle 资源，
      # 必须先构建 mirrorstar-wp-proc 再编译任何触发 src-tauri 的命令
      - name: Build wp-proc resource
        run: cargo build -p mirrorstar-wp-proc --release

      # 提供 mpv 运行时：mpv/ 在 .gitignore 中（mpv.exe ~123MB 超 GitHub 100MB 入库限制），
      # 且 tauri_build::try_build 编译期校验 `../mpv/mpv.exe` 必须存在，否则 src-tauri 编译失败。
      # 从固定 release + SHA256 双保险下载，仅解出 mpv.exe（mpv/license 已随源码入库）。
      # 若不升级 mpv，版本列 20260903 与期望 SHA256 应同步保持锁定。
      - name: Provision mpv runtime
        shell: pwsh
        run: |
          $mpvUrl    = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260903/mpv-x86_64-v3-20260903-git-69e63f425a.7z"
          $mpvSha256 = "8786587181584f49e79217913043c5969beaae1ef202d6b6d4bc9ee708fdc75e"
          $target    = "mpv\mpv.exe"
          if (Test-Path $target) {
            Write-Host "mpv.exe already present, skipping download (cached/ahead-of-checkout)"
            exit 0
          }
          $archive  = Join-Path $env:RUNNER_TEMP "mpv-x86_64-v3-20260903.7z"
          $extract  = Join-Path $env:RUNNER_TEMP "mpv-extract"
          Write-Host "Downloading pinned mpv (20260903) ..."
          Invoke-WebRequest -Uri $mpvUrl -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $mpvSha256) {
            throw "mpv SHA256 mismatch: expected $mpvSha256, got $hash"
          }
          $sevenZip = @("C:\Program Files\7-Zip\7z.exe", "C:\Program Files (x86)\7-Zip\7z.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sevenZip) {
            $cmd = Get-Command 7z.exe -ErrorAction SilentlyContinue
            if ($cmd) { $sevenZip = $cmd.Source }
          }
          if (-not $sevenZip) { throw "7-Zip (7z.exe) not found on runner" }
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          & $sevenZip x -y "-o$extract" $archive mpv.exe | Out-Null
          $exe = Join-Path $extract "mpv.exe"
          if (-not (Test-Path $exe)) { throw "mpv.exe was not extracted from archive" }
          Copy-Item $exe $target
          Write-Host "mpv.exe provisioned: $((Get-Item $target).Length) bytes"

      # cargo test 已隐含编译，无需独立 Build 步骤；共享资源类测试标记 #[ignore] 由下方串行执行
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      # 共享资源类测试串行执行（continue-on-error: true，不阻断 CI/release 流程）
      - name: Run ignored tests
        run: cargo test --workspace -- --ignored
        continue-on-error: true

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: cargo audit

  frontend-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Node 20 LTS：覆盖 Vite 5 / Vitest 2 / TypeScript 5.5 / ESLint 9 官方支持矩阵
      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Security audit (dev dependencies)
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test
