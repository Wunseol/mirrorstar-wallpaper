# Dependabot 更新策略
# ──────────────────────────────────────────────────────────────────────────
# weekly（每周一）调度，覆盖 cargo / npm / github-actions 三生态。
# 安全补丁由 CI 中 cargo audit + npm audit 兜底，不依赖 Dependabot 主动发现；
# 紧急补丁可通过手动 cargo update -p <crate> 立即应用。
# major 版本升级需单独评估 CHANGELOG，不在常规 PR 流程合并。
#
# v16-D-018 增强：
# - groups：按生态分组聚合同生态 minor/patch 升级到单 PR，减少 PR 噪音
#   （cargo 全部 crate 一组、npm production 与 development 分别成组）
# - ignore：忽略高频 dev-deps 的 patch 级别升级（@types/*、@vitest/*、eslint-*），
#   仅保留 minor 级别以上的更新；避免每周被类型定义与 lint 规则的 patch 淹没
# - commit-message：统一 `chore(deps):` 前缀，便于在 git log 中过滤依赖类提交
# ──────────────────────────────────────────────────────────────────────────

version: 2
updates:
  # Rust 依赖（workspace 根 Cargo.toml + 子 crate Cargo.toml）
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    groups:
      # cargo 生态：所有 minor/patch 升级合并为单 PR
      cargo-minor:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm 依赖（package.json + package-lock.json）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    groups:
      # 生产依赖 minor/patch 合并为单 PR
      npm-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # 开发依赖 minor/patch 合并为单 PR
      npm-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # 忽略高频 dev-deps 的 patch 级别升级（仅保留 minor+ 升级）
    # 类型定义每周都有 patch 升级但通常无功能影响，聚合后仍噪音过大
    ignore:
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "eslint-*"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions 版本（.github/workflows/ 中使用的 actions）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # 所有 actions 升级合并为单 PR（actions 生态升级频率低，单 PR 即可）
      github-actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
