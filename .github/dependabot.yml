# Dependabot 更新策略
# ──────────────────────────────────────────────────────────────────────────
# weekly（每周一）调度，覆盖 cargo / github-actions 两生态。
# 安全补丁由 CI 中 cargo audit 兜底，不依赖 Dependabot 主动发现；
# 紧急补丁可通过手动 cargo update -p <crate> 立即应用。
# major 版本升级需单独评估 CHANGELOG，不在常规 PR 流程合并。
#
# v16-D-018 增强：
# - groups：按生态分组聚合同生态 minor/patch 升级到单 PR，减少 PR 噪音
#   （cargo 全部 crate 一组）
# - commit-message：统一 `chore(deps):` 前缀，便于在 git log 中过滤依赖类提交
# ──────────────────────────────────────────────────────────────────────────

version: 2
updates:
  # Rust 依赖（workspace 根 Cargo.toml + 子 crate Cargo.toml）
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    groups:
      # cargo 生态：所有 minor/patch 升级合并为单 PR
      cargo-minor:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions 版本（.github/workflows/ 中使用的 actions）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # 所有 actions 升级合并为单 PR（actions 生态升级频率低，单 PR 即可）
      github-actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
