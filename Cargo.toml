[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/mirrorstar-core",
    "crates/mirrorstar-wp-proc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
# Windows API bindings
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
# v16-D-013：收紧到 minor 级（1.52），避免 dependabot 在 minor 范围内自由升级引入 breaking change
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "sync", "io-util"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Image processing
# default-features = false，仅启用实际使用的格式（png/jpeg/gif/bmp/webp/tiff）
# 移除默认启用的 dds/exr/ff/hdr/ico/pnm/qoi/tga，减小编译时间与二进制体积
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "rayon"] }

# File system
dirs = "6"
notify = "7"
fs2 = "0.4"

# Windows registry
# v16-D-010 / v16-D-016：对齐 Cargo.lock 实际拉取的 0.55.0（其他传递依赖已引入），
# 避免编译两份 winreg（0.52 + 0.55），减小编译产物与编译时间
winreg = "0.55"

# UUID
uuid = { version = "1", features = ["v4"] }

# CLI
clap = { version = "4", features = ["derive"] }

# WebView2
# v16-D-010 评估结论：保持 0.34 不升级到 0.38。
# webview2-com 0.38 传递依赖 windows 0.61，与 workspace 声明的 windows 0.58 不兼容
# （Param<PCWSTR> trait 跨版本不互通，编译报 E0277）。升级需同步 windows 0.58→0.61，
# 跨 3 个 minor 版本 API 改名风险高，收益小，按 Low 风险保守不升。
webview2-com = "0.34"

# Tauri
# v16-D-011：移除 "protocol-asset" feature（前端全面切换 wpfile，asset 协议为死代码）
# v16-D-013：收紧到 minor 级，Tauri 生态 minor 版本含 command API 变更
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-autostart = "2.5"

# URL percent-decoding（wpfile:// 自定义协议路径解码）
percent-encoding = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
# panic = "abort" 减小二进制体积（移除 unwind 表），壁纸应用无需 panic 恢复
panic = "abort"

# dev 模式启用基本优化，显著改善 GIF 解码等重计算场景的性能
# opt-level = 0 导致 dev 模式下 GIF 解码极慢；opt-level = 1 在保持快速编译的同时提供合理性能
[profile.dev]
opt-level = 1
